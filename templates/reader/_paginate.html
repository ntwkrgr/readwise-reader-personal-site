<div id="page-indicator" style="display:none"></div>
<script data-role="paginate-script">
(function() {
    var articleEl = document.getElementById('article-content');
    if (!articleEl) return;

    var TAP_THRESHOLD = 10;       // px movement still counts as a tap, not a swipe
    var EDGE_PAD = 4;             // px subpixel-rounding safety margin (not an anti-bleed mechanism)
    var MIN_ADVANCE = 40;         // px; guards a single atom taller than one page
    var RESIZE_DEBOUNCE = 250;    // ms
    var MAX_CONTENT_CHARS = 200000; // guard rail: skip measurement past this length

    // Block-level tags moved as a single unit when they'd straddle a page boundary.
    // TABLE and HR can't take a spacer as a child (TABLE's content model rejects a
    // bare DIV; HR is a void element), so they get a spacer inserted as a preceding
    // sibling instead - see insertSpacerBefore().
    var ATOM_TAGS = ['P', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE', 'TABLE', 'HR'];
    var SIBLING_INSERT_TAGS = { HR: true, TABLE: true };

    var starts = [0];
    var currentIndex = 0;
    var paginationEnabled = true;
    var startX = null;
    var startY = null;
    var handledTouch = false;
    var resizeTimer = null;
    var insertedSpacers = [];
    var indicatorEl = document.getElementById('page-indicator');

    function getViewportH() {
        return document.documentElement.clientHeight || window.innerHeight || 600;
    }

    function getViewportW() {
        return document.documentElement.clientWidth || window.innerWidth || 800;
    }

    function getScrollY() {
        var y = window.pageYOffset;
        if (typeof y !== 'number') {
            y = document.documentElement.scrollTop || document.body.scrollTop || 0;
        }
        return y;
    }

    function getDocHeight() {
        return Math.max(
            document.body.scrollHeight || 0,
            document.documentElement.scrollHeight || 0
        );
    }

    function isInLink(target) {
        var t = target;
        while (t && t !== articleEl) {
            if (t.tagName === 'A') return true;
            t = t.parentNode;
        }
        return false;
    }

    function isHighlightModeActive() {
        return articleEl.classList.contains('highlight-mode-active');
    }

    // --- Boundary measurement -------------------------------------------
    //
    // Scrolling to a computed "page start" doesn't stop the browser from painting
    // a full viewport's worth of content from that point on - it always renders
    // [scrollY, scrollY + viewportHeight). So a line sitting just above a page
    // boundary is *already* partially visible on the previous page before you even
    // tap to advance; no amount of tweaking which line's top becomes the next
    // page's scroll target fixes that; the content physically bleeds through.
    //
    // The only way to keep a boundary clean is to physically relocate whatever
    // content would straddle it, by inserting blank spacer height right before it
    // (see insertSpacerBefore/computeStarts below) - the same technique already
    // used for the trailing spacer at the end of the document, just applied at
    // every internal boundary too. To keep that relocation simple and safe (no
    // text-node splitting), the unit that gets moved is a whole block-level
    // element (a paragraph, heading, list item, etc - see ATOM_TAGS), not an
    // individual wrapped line.

    function collectAtoms() {
        var atoms = [];
        var scrollY = getScrollY();
        var seenTextParents = [];

        function pushAtom(node) {
            var rect = node.getBoundingClientRect();
            if (!rect || rect.height <= 0) return;
            atoms.push({ top: rect.top + scrollY, bottom: rect.bottom + scrollY, node: node });
        }

        var walker = document.createTreeWalker(
            articleEl,
            NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT,
            {
                acceptNode: function(node) {
                    if (node.nodeType === 1) {
                        if (ATOM_TAGS.indexOf(node.tagName) !== -1) {
                            pushAtom(node);
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_SKIP;
                    }
                    if (!node.nodeValue || !/\S/.test(node.nodeValue)) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            },
            false
        );

        var node;
        while ((node = walker.nextNode())) {
            // Loose text directly inside a non-atom wrapper (rare for sanitized
            // article HTML, but not impossible) - treat its parent as the atom.
            var parent = node.parentElement || articleEl;
            if (seenTextParents.indexOf(parent) === -1) {
                seenTextParents.push(parent);
                pushAtom(parent);
            }
        }

        var toolbars = articleEl.parentNode.querySelectorAll('.toolbar');
        if (toolbars.length > 0) {
            pushAtom(toolbars[toolbars.length - 1]);
        }

        atoms.sort(function(a, b) { return a.top - b.top; });
        return atoms;
    }

    function removeAllSpacers() {
        for (var i = 0; i < insertedSpacers.length; i++) {
            var el = insertedSpacers[i];
            if (el.parentNode) el.parentNode.removeChild(el);
        }
        insertedSpacers = [];
    }

    function makeSpacer(height) {
        var spacer = document.createElement('div');
        spacer.setAttribute('aria-hidden', 'true');
        spacer.style.height = height + 'px';
        return spacer;
    }

    // Pushes `atomNode` down by `height` px so it starts exactly at the page
    // boundary instead of straddling it. Inserted as a preceding sibling for
    // TABLE/HR (whose content model can't take a block child); as a first child
    // otherwise, so the atom's own box stays put and its content is shifted down
    // within it - avoiding any DOM-validity issues with the atom's parent (e.g. an
    // LI's parent UL doesn't accept a bare DIV sibling between list items).
    function insertSpacerBefore(atomNode, height) {
        var spacer = makeSpacer(height);
        if (SIBLING_INSERT_TAGS[atomNode.tagName]) {
            atomNode.parentNode.insertBefore(spacer, atomNode);
        } else {
            atomNode.insertBefore(spacer, atomNode.firstChild);
        }
        insertedSpacers.push(spacer);
    }

    function appendTailSpacer(height) {
        if (height <= 0) return;
        var spacer = makeSpacer(height);
        document.body.appendChild(spacer);
        insertedSpacers.push(spacer);
    }

    function computeStarts() {
        removeAllSpacers();

        // viewportH is the real, un-shrunk boundary: nothing may cross it, because
        // scrolling to `cur` always paints [cur, cur + viewportH), whatever is
        // there. EDGE_PAD is only a landing buffer for a relocated atom - it must
        // clear the real edge, so it lands a few px *past* viewportH, never short
        // of it (landing short is exactly the bleed this fix removes).
        var viewportH = getViewportH();
        var minPageH = MIN_ADVANCE;

        var atoms = collectAtoms();
        var result = [0];
        var cur = 0;
        var shift = 0; // cumulative height inserted by spacers so far

        for (var i = 0; i < atoms.length; i++) {
            var top = atoms[i].top + shift;
            var bottom = atoms[i].bottom + shift;
            var limit = cur + Math.max(viewportH, minPageH);
            if (bottom <= limit + 0.5) continue; // fits fully on the current page

            var landing = limit + EDGE_PAD;
            if (top <= cur + MIN_ADVANCE + 0.5) {
                // This atom is already at the start of the page and alone is
                // taller than one page (e.g. a huge table). No spacer can help -
                // accept a hard cut rather than an infinite loop or a zero-height
                // page. Rare/pathological; matches the previous safety net.
                top = limit;
            } else if (top < landing) {
                // Straddles (or lands too close to) the boundary - relocate it
                // to start just past the real edge.
                var need = landing - top;
                insertSpacerBefore(atoms[i].node, need);
                shift += need;
                top = landing;
            }
            // else: top already >= landing - a natural gap (margin) already
            // clears the boundary with room to spare, so this atom can simply
            // start the next page as-is.

            result.push(top);
            cur = top;
        }

        var docHeight = getDocHeight();
        var lastStart = result[result.length - 1];
        appendTailSpacer((lastStart + viewportH) - docHeight);

        return result;
    }

    function updateIndicator() {
        if (!indicatorEl) return;
        if (!paginationEnabled || starts.length <= 1 || isHighlightModeActive()) {
            indicatorEl.style.display = 'none';
            return;
        }
        indicatorEl.style.display = 'block';
        indicatorEl.textContent = (currentIndex + 1) + ' / ' + starts.length;
    }

    function syncCurrentIndexFromScroll() {
        var y = getScrollY();
        var best = 0;
        var bestDelta = Infinity;
        for (var i = 0; i < starts.length; i++) {
            var delta = Math.abs(starts[i] - y);
            if (delta < bestDelta) {
                bestDelta = delta;
                best = i;
            }
        }
        currentIndex = best;
    }

    function goToIndex(index) {
        if (index < 0) index = 0;
        if (index > starts.length - 1) index = starts.length - 1;
        currentIndex = index;
        window.scrollTo(0, starts[currentIndex]);
        updateIndicator();
    }

    function goForward() {
        syncCurrentIndexFromScroll();
        goToIndex(currentIndex + 1);
    }

    function goBack() {
        syncCurrentIndexFromScroll();
        goToIndex(currentIndex - 1);
    }

    function handleTap(target, clientX) {
        if (isInLink(target)) return;
        if (clientX < getViewportW() / 2) {
            goBack();
        } else {
            goForward();
        }
    }

    function recompute() {
        starts = computeStarts();
        syncCurrentIndexFromScroll();
        // Re-snap to the boundary nearest the pre-recompute scroll position.
        window.scrollTo(0, starts[currentIndex]);
        updateIndicator();
    }

    function init() {
        if (articleEl.textContent && articleEl.textContent.length > MAX_CONTENT_CHARS) {
            paginationEnabled = false;
            if (indicatorEl) indicatorEl.style.display = 'none';
            return;
        }
        starts = computeStarts();
        syncCurrentIndexFromScroll();
        updateIndicator();
    }

    articleEl.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        } else {
            startX = null;
            startY = null;
        }
    }, false);

    articleEl.addEventListener('touchend', function(e) {
        if (!paginationEnabled || isHighlightModeActive()) {
            startX = null;
            startY = null;
            return;
        }
        if (startY === null) return;
        var t = e.changedTouches && e.changedTouches[0];
        var sx = startX, sy = startY;
        startX = null;
        startY = null;
        if (!t) return;
        var dx = Math.abs(t.clientX - sx);
        var dy = Math.abs(t.clientY - sy);
        if (dx > TAP_THRESHOLD || dy > TAP_THRESHOLD) return; // swipe/scroll, not a tap
        handledTouch = true;
        handleTap(e.target, t.clientX);
        setTimeout(function() { handledTouch = false; }, 500);
    }, false);

    articleEl.addEventListener('click', function(e) {
        if (!paginationEnabled || isHighlightModeActive()) return;
        if (handledTouch) return;
        handleTap(e.target, e.clientX);
    }, false);

    window.addEventListener('resize', function() {
        if (!paginationEnabled) return;
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(recompute, RESIZE_DEBOUNCE);
    }, false);

    window.addEventListener('orientationchange', function() {
        if (!paginationEnabled) return;
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(recompute, RESIZE_DEBOUNCE);
    }, false);

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
    } else {
        document.addEventListener('DOMContentLoaded', init);
    }

    // Read-only inspection hook for the automated pagination test
    // (tests/test_pagination_browser.py). Not used by any runtime behavior.
    window.__readerPaginationDebug = {
        getStarts: function() { return starts.slice(); },
        getPageH: function() {
            return Math.max(getViewportH(), MIN_ADVANCE);
        },
        collectAtoms: collectAtoms
    };
})();
</script>
